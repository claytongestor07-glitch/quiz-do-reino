name: Preparar ambiente
description: Node + dependências, FFmpeg, navegador do Remotion e voz Kokoro (modelo em cache)
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: npm
    - run: npm ci --no-audit --no-fund
      shell: bash
    # FFmpeg estático (build do BtbN, no próprio GitHub): o apt-get travou 10–20 min em algumas máquinas
    - uses: actions/cache@v4
      with:
        path: ~/ffmpeg
        key: ffmpeg-btbn-v2
    - name: FFmpeg
      shell: bash
      run: |
        if [ ! -x ~/ffmpeg/bin/ffmpeg ]; then
          mkdir -p ~/ffmpeg
          # Os nomes dos arquivos mudam a cada versão: escolhe a versão estável mais antiga publicada (ex.: n8.1)
          url=$(curl -sSf --retry 3 https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/tags/latest \
            | jq -r '[.assets[].browser_download_url | select(test("ffmpeg-n[0-9.]+-latest-linux64-gpl-[0-9.]+\\.tar\\.xz$"))] | sort | .[0]')
          echo "FFmpeg: $url"
          curl -sSfL --retry 3 "$url" | tar -xJ --strip-components=1 -C ~/ffmpeg
        fi
        echo "$HOME/ffmpeg/bin" >> "$GITHUB_PATH"
        ~/ffmpeg/bin/ffmpeg -version | head -1
    - run: npx remotion browser ensure
      shell: bash
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Voz Kokoro
      shell: bash
      run: |
        python -m venv .venv-kokoro
        .venv-kokoro/bin/pip install -q kokoro-onnx==0.4.9 onnxruntime==1.23.2 numpy==2.5.4 phonemizer-fork==3.3.2 espeakng-loader==0.2.4
    - uses: actions/cache@v4
      with:
        path: modelos/kokoro
        key: kokoro-v1.0
    - name: Modelo Kokoro
      shell: bash
      run: |
        mkdir -p modelos/kokoro && cd modelos/kokoro
        base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
        [ -s kokoro-v1.0.int8.onnx ] || curl -sSfLO $base/kokoro-v1.0.int8.onnx
        [ -s voices-v1.0.bin ] || curl -sSfLO $base/voices-v1.0.bin
