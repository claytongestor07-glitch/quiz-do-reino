# Kenji Studio (repositório privado kenji-studio): candidatas a imagem de referência dos personagens,
# geradas na GPU gratuita do Kaggle (SDXL). Fica aqui porque este repositório já tem o segredo do Kaggle.
# O resultado sai como artefato "kenji-referencias". As referências aprovadas ficam públicas em kenji/*.jpg para o Kaggle baixar.
name: Kenji - referências
on:
  workflow_dispatch:
    inputs:
      script:
        description: kenji_referencias (candidatas) ou kenji_fichas (vistas e expressões a partir das referências aprovadas)
        default: kenji_referencias
jobs:
  kaggle:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q -U kaggle
      - name: Enviar para a GPU do Kaggle
        run: |
          python scripts/kaggle/chave.py mascarar
          python scripts/kaggle/chave.py >> "$GITHUB_ENV"
          set -a; . <(python scripts/kaggle/chave.py); set +a
          USUARIO=$(python -c "import kaggle; print(kaggle.api.get_config_value('username') or '')")
          test -n "$USUARIO"
          N=$(echo "${{ inputs.script }}" | tr _ -); echo "KERNEL=$USUARIO/$N" >> "$GITHUB_ENV"
          mkdir k && cp scripts/kaggle/${{ inputs.script }}.py k/
          cat > k/kernel-metadata.json <<EOF
          {"id": "$USUARIO/$N", "title": "$N", "code_file": "${{ inputs.script }}.py",
           "language": "python", "kernel_type": "script", "is_private": true,
           "enable_gpu": true, "enable_internet": true, "machine_shape": "NvidiaTeslaT4"}
          EOF
          kaggle kernels push -p k
      - name: Aguardar a GPU
        run: |
          sleep 120
          for i in $(seq 1 220); do
            S=$(kaggle kernels status "$KERNEL" 2>&1 | tail -1); echo "$(date +%H:%M) $S"
            case "$S" in *COMPLETE*) break;; *ERROR*|*CANCEL*) break;; esac
            sleep 60
          done
          mkdir -p saida && kaggle kernels output "$KERNEL" -p saida
          tail -40 saida/*.log || true
          ls saida/*.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kenji-referencias
          path: saida/*
  # Poses do piloto (script=kenji_planos) e animais 3D do quiz (script=animais_3d): recorta o fundo liso
  recortar:
    needs: kaggle
    if: inputs.script == 'kenji_planos' || inputs.script == 'animais_3d'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kenji-referencias
          path: brutas
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q "rembg[cpu]" pillow
      - name: Recortar poses
        run: |
          mkdir -p recortes
          python - <<'EOF'
          from pathlib import Path
          from PIL import Image
          from rembg import new_session, remove
          s = new_session('isnet-general-use')
          for p in sorted([*Path('brutas').glob('pose-*.png'), *Path('brutas').glob('animal-*.png')]):
              remove(Image.open(p), session=s).save(Path('recortes') / p.name)
              print(p.name, flush=True)
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: kenji-recortes
          path: recortes/*
