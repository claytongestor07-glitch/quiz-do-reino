# Uso único: recorta os personagens da arte dos clipes e reconstrói o cenário; o resultado sai como artefato "recortes".
name: Recortar personagens
on: workflow_dispatch
jobs:
  recortar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q "rembg[cpu]" pillow scipy simple-lama-inpainting
      - run: python scripts/recortar_clipe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recortes
          path: recortes/*
