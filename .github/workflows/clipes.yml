# Clipes musicais do canal (formato Bento e Totó), produzidos nas máquinas do GitHub: nada é guardado no Mac.
# planejar → cantar (ACE-Step 1.5, modelo aberto) → render em paralelo (16:9, celular, Short) → enviar ao YouTube
name: Produzir clipe

on:
  schedule:
    - cron: '47 1,9,15,21 * * *'
  workflow_dispatch:
    inputs:
      musica:
        description: 'Música (vazio = próxima da fila)'
        required: false
      enviar:
        description: 'Enviar ao YouTube (desligado = só gera os vídeos para assistir)'
        type: boolean
        default: true

concurrency:
  # Prévias manuais (sem enviar) não esperam nem cancelam a fila de publicação
  group: ${{ github.event_name == 'workflow_dispatch' && !inputs.enviar && format('previa-{0}', inputs.musica) || 'produzir' }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  planejar:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      id: ${{ steps.plano.outputs.id }}
      idioma: ${{ steps.plano.outputs.idioma }}
    steps:
      - uses: actions/checkout@v4
      - id: plano
        run: node scripts/clipes.mjs proximo "${{ inputs.musica }}"

  cantar:
    needs: planejar
    if: needs.planejar.outputs.id != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Liberar disco
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
      # Sem cache do uv: a limpeza dele ao fim do job falhava e derrubava o job inteiro (os modelos têm cache próprio)
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - uses: actions/cache@v4
        with:
          path: ace/checkpoints
          key: ace-step-15-turbo-lm06-v1
      - name: Instalar ACE-Step 1.5
        run: |
          git clone --depth 1 https://github.com/ACE-Step/ACE-Step-1.5.git ace-src
          cp -r ace-src/. ace/ && rm -rf ace-src
          cd ace && uv python install 3.11 && uv sync
      - name: Cantar
        env:
          ACESTEP_DEVICE: cpu
          ACESTEP_LM_BACKEND: pt
          ACESTEP_LM_MODEL_PATH: acestep-5Hz-lm-0.6B
          ACESTEP_CONFIG_PATH: acestep-v15-turbo
          ACESTEP_INIT_LLM: 'true'
        run: |
          (cd ace && uv run acestep-api > ../ace.log 2>&1 &)
          for i in $(seq 1 240); do curl -sf localhost:8001/health >/dev/null && break; sleep 15; done
          python3 scripts/cantar.py ${{ needs.planejar.outputs.id }} || { tail -40 ace.log; exit 1; }
      - name: Sincronizar a letra (karaokê)
        run: uv run --python 3.11 --with faster-whisper python scripts/alinhar.py ${{ needs.planejar.outputs.id }}
      - uses: actions/upload-artifact@v4
        with:
          name: musica
          retention-days: 3
          path: |
            musicas/${{ needs.planejar.outputs.id }}/musica.wav
            musicas/${{ needs.planejar.outputs.id }}/palavras.json

  render:
    needs: [planejar, cantar]
    # Só depende da música ter sido gerada (o download abaixo falha se não foi)
    if: ${{ !cancelled() && needs.planejar.outputs.id != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        variante: ['', '--vertical', '--short']
    env:
      RENDER_CONCORRENCIA: 4
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/preparar
      - uses: actions/download-artifact@v4
        with:
          name: musica
          path: musicas/${{ needs.planejar.outputs.id }}
      - run: node scripts/clipe.mjs ${{ needs.planejar.outputs.id }} ${{ matrix.variante }}
      - uses: actions/upload-artifact@v4
        with:
          name: clipe${{ matrix.variante }}
          retention-days: 7
          path: |
            saida/clipes/*.mp4
            saida/clipes/*.jpg

  enviar:
    needs: [planejar, render]
    if: needs.planejar.outputs.id != '' && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Agendado: sempre envia. Manual: conforme a opção "enviar" (inputs vazios valem false nas comparações do GitHub)
    concurrency:
      group: publicacao-youtube
      cancel-in-progress: false
    env:
      ENVIAR: ${{ github.event_name != 'workflow_dispatch' || inputs.enviar }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: clipe*
          merge-multiple: true
          path: saida/clipes
      - name: Credenciais do YouTube
        if: env.ENVIAR == 'true'
        env:
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_TOKEN: ${{ secrets.YT_TOKEN }}
          YT_TOKEN_EN: ${{ secrets.YT_TOKEN_EN }}
          YT_TOKEN_ES: ${{ secrets.YT_TOKEN_ES }}
          IDIOMA: ${{ needs.planejar.outputs.idioma }}
        run: |
          mkdir -p ~/.config/pequenos-sabios && chmod 700 ~/.config/pequenos-sabios
          printf '%s' "$YT_CLIENT_SECRET" > ~/.config/pequenos-sabios/client_secret.json
          printf '%s' "$YT_TOKEN" > ~/.config/pequenos-sabios/token.json
          # Canais separados por idioma: sem o token do canal daquele idioma, não envia (nunca cai no canal em português)
          case "$IDIOMA" in
            en) TOKEN_IDIOMA="$YT_TOKEN_EN" ;;
            es) TOKEN_IDIOMA="$YT_TOKEN_ES" ;;
            *) TOKEN_IDIOMA="" ;;
          esac
          if [ -n "$IDIOMA" ] && [ "$IDIOMA" != pt ]; then
            [ -n "$TOKEN_IDIOMA" ] || { echo "Canal $IDIOMA ainda não conectado (segredo YT_TOKEN_$(echo $IDIOMA | tr a-z A-Z))"; exit 1; }
            printf '%s' "$TOKEN_IDIOMA" > ~/.config/pequenos-sabios/token-$IDIOMA.json
          fi
          chmod 600 ~/.config/pequenos-sabios/*
      - name: Agendar no YouTube
        if: env.ENVIAR == 'true'
        run: node scripts/clipes.mjs enviar ${{ needs.planejar.outputs.id }}
      - name: Guardar agenda e envios no repositório
        if: always() && env.ENVIAR == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add musicas logs/agenda.json; git add -f logs/limite-envio.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Envios de ${{ needs.planejar.outputs.id }}"
          # A agenda e o limite de envios mudam a cada publicação: tenta de novo se outra execução gravou antes
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && exit 0; git rebase --abort 2>/dev/null; sleep $((i * 10)); done; exit 1
