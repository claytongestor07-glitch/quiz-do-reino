# Remove o fundo das imagens de uma pasta do repositório (rembg) e devolve como artefato "recortes".
# Uso: Actions → Recortar imagens → pasta (ex.: docs/kiko)
name: Recortar imagens
on:
  workflow_dispatch:
    inputs:
      pasta:
        description: pasta com as imagens (png/jpg)
        default: docs/kiko
jobs:
  recortar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q "rembg[cpu]" pillow
      - run: |
          mkdir -p recortes
          python - <<'EOF'
          from pathlib import Path
          from PIL import Image
          from rembg import new_session, remove
          s = new_session('isnet-general-use')
          for p in sorted([*Path('${{ inputs.pasta }}').glob('*.png'), *Path('${{ inputs.pasta }}').glob('*.jpg')]):
              remove(Image.open(p), session=s).save(Path('recortes') / f'{p.stem}.png')
              print(p.name, flush=True)
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: recortes
          path: recortes/*
